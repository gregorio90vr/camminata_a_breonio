<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Da casa a Breonio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root {
  --bg:        #101f18;
  --surface:   #182c22;
  --surface-2: #213b2d;
  --border:    rgba(232,179,79,0.18);
  --text:      #f3f0e4;
  --muted:     #9db69f;
  --gold:      #e8b34f;
  --route:     #f2683f;
  --route-dim: #6f8a71;
  --peak:      #c0392b;
  --start:     #4a9d5f;
  --shadow:    0 4px 20px rgba(0,0,0,0.45);
  --panel-h:   210px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ---------- Header ---------- */
#header {
  background: linear-gradient(135deg, #2d5738 0%, #16301f 100%);
  padding: 12px 18px 11px;
  box-shadow: var(--shadow);
  z-index: 900;
  flex: none;
  border-bottom: 1px solid var(--border);
}
#titlebar { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
#header h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.2px; }
#header .sub { font-size: 12px; color: #b9d0b6; }

#stats { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.stat {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 9px;
  padding: 5px 11px;
  font-size: 10.5px;
  color: var(--muted);
  letter-spacing: 0.4px;
  text-transform: uppercase;
  line-height: 1.35;
}
.stat b {
  display: block;
  font-size: 15px;
  color: var(--gold);
  letter-spacing: 0;
  text-transform: none;
  font-variant-numeric: tabular-nums;
}

/* ---------- Map ---------- */
#map { flex: 1 1 auto; width: 100%; min-height: 0; background: #0d1a14; }

.marker-pin {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 12.5px;
  color: #fff;
  background: #2d5738;
  border: 2.5px solid #f5f1e6;
  box-shadow: 0 2px 7px rgba(0,0,0,0.55);
  transition: transform .15s ease;
}
.marker-pin.is-peak  { background: var(--peak); }
.marker-pin.is-start { background: var(--start); }
.marker-pin.is-end   { background: var(--gold); color: #17301f; }
.marker-pin:hover    { transform: scale(1.18); }

.leaflet-popup-content-wrapper { border-radius: 12px; background: #fdfcf7; box-shadow: var(--shadow); }
.leaflet-popup-content { margin: 12px 14px; min-width: 190px; }
.popup-title { font-size: 15px; font-weight: 700; color: #17301f; margin-bottom: 7px; line-height: 1.25; }
.popup-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 7px; }
.badge {
  font-size: 10.5px; font-weight: 700;
  padding: 3px 8px; border-radius: 20px;
  background: #eae5d4; color: #3a4a3c;
  font-variant-numeric: tabular-nums;
}
.badge.q  { background: var(--gold); color: #17301f; }
.badge.km { background: #e0ded2; }
.popup-notes { font-size: 12.5px; color: #3b3b3b; line-height: 1.45; }

.leaflet-control-attribution { font-size: 9.5px !important; }
.leaflet-bar a { background: #1d3226 !important; color: #e9e5d6 !important; border-color: rgba(255,255,255,.1) !important; }
.leaflet-bar a:hover { background: #2a4634 !important; }
.leaflet-control-layers {
  background: rgba(24,44,34,.94) !important;
  color: var(--text); border: 1px solid var(--border) !important;
  border-radius: 9px !important; box-shadow: var(--shadow) !important;
}
.leaflet-control-layers-expanded { padding: 8px 12px 8px 8px !important; font-size: 12.5px; }

#legend {
  background: rgba(24,44,34,.92);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 8px 10px;
  font-size: 11px;
  color: var(--muted);
  box-shadow: var(--shadow);
  line-height: 1.7;
}
#legend i { display: inline-block; width: 20px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 7px; }

/* ---------- Elevation panel ---------- */
#panel {
  flex: none;
  background: var(--surface);
  border-top: 1px solid var(--border);
  box-shadow: 0 -4px 18px rgba(0,0,0,.4);
  z-index: 800;
  display: flex;
  flex-direction: column;
}
#panel-head {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px;
  cursor: pointer;
  user-select: none;
  flex: none;
}
#panel-head h2 {
  font-size: 11px; font-weight: 700; letter-spacing: 1.1px;
  text-transform: uppercase; color: var(--muted);
}
#hint { font-size: 11px; color: #6f8a72; margin-left: auto; margin-right: 4px; }
#hint.active { color: var(--gold); }

#clear {
  background: rgba(255,255,255,.08);
  border: 1px solid var(--border);
  color: var(--muted);
  width: 26px; height: 26px; border-radius: 7px;
  font-size: 12px; cursor: pointer; flex: none;
  display: none; align-items: center; justify-content: center;
}
#clear:hover { color: var(--gold); }
body.has-sel #clear { display: flex; }

#toggle {
  background: rgba(255,255,255,.08);
  border: 1px solid var(--border);
  color: var(--gold);
  width: 26px; height: 26px; border-radius: 7px;
  font-size: 11px; cursor: pointer; flex: none;
  display: flex; align-items: center; justify-content: center;
  transition: transform .25s ease;
}
body.collapsed #toggle { transform: rotate(180deg); }

#panel-body {
  height: var(--panel-h);
  overflow: hidden;
  transition: height .28s ease;
  display: flex; flex-direction: column;
}
body.collapsed #panel-body { height: 0; }

#readout {
  display: flex; gap: 6px;
  padding: 0 14px 8px;
  flex-wrap: wrap;
  flex: none;
}
.ro {
  flex: 1 1 88px;
  background: var(--surface-2);
  border: 1px solid rgba(255,255,255,.05);
  border-radius: 9px;
  padding: 6px 9px;
}
.ro span {
  display: block; font-size: 9.5px; letter-spacing: .5px;
  text-transform: uppercase; color: var(--muted); margin-bottom: 1px;
}
.ro b { font-size: 14.5px; font-variant-numeric: tabular-nums; letter-spacing: -.2px; }
/* colori assegnati da JS, diversi fra modalita' punto e intervallo */
.ro.c-gold  b { color: var(--gold); }
.ro.c-dim   b { color: var(--route-dim); }
.ro.c-route b { color: var(--route); }
.ro.c-desc  b { color: #7fb0d6; }
.ro.c-soft  b { color: #cfe3cd; }

#chartwrap { flex: 1 1 auto; min-height: 0; padding: 0 6px 4px; }
#chart { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

@media (max-width: 620px) {
  :root { --panel-h: 190px; }
  #header { padding: 10px 13px 9px; }
  #header h1 { font-size: 15.5px; }
  #header .sub { display: none; }
  #stats { gap: 6px; margin-top: 8px; }
  .stat { padding: 4px 8px; font-size: 9px; border-radius: 8px; }
  .stat b { font-size: 13px; }
  #hint { display: none; }
  .ro { flex: 1 1 68px; padding: 5px 7px; }
  .ro b { font-size: 12.5px; }
  .ro span { font-size: 8.5px; }
  #legend { display: none; }
}
</style>
</head>

function haversine(lon1, lat1, lon2, lat2) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

const TOTAL_TIME = 29326;
// Sforzo = distanza + 8x dislivello: ripartisce il tempo in modo
// realistico fra tratti pianeggianti e salite.
const effort = i => cumDist[i] + 8 * cumAsc[i];
const TOTAL_EFFORT = effort(N - 1);

// Indice del punto di TRACK piu' vicino a ciascun waypoint
const stopIndex = stops.map(s => {
  let best = 0, bestD = Infinity;
  for (let i = 0; i < N; i++) {
    const d = haversine(s.lng, s.lat, TRACK[i][0], TRACK[i][1]);
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
});
stopIndex[0] = 0;
stopIndex[stopIndex.length - 1] = N - 1;

/* ============================================================
   FORMATTAZIONE
   ============================================================ */
const fmtKm  = m => (m / 1000).toLocaleString('it-IT', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' km';
const fmtM   = m => Math.round(m).toLocaleString('it-IT') + ' m';
const fmtDur = s => {
  const h = Math.floor(s / 3600), mn = Math.round((s % 3600) / 60);
  return mn === 60 ? (h + 1) + 'h 00' : (h > 0 ? h + 'h ' + String(mn).padStart(2, '0') : mn + ' min');
};

// Statistiche di testata, tutte calcolate dal tracciato
document.getElementById('s-dist').textContent  = fmtKm(TOTAL_DIST);
document.getElementById('s-asc').textContent   = '+' + fmtM(TOTAL_ASC);
document.getElementById('s-time').textContent  = fmtDur(TOTAL_TIME);
document.getElementById('s-max').textContent   = fmtM(eleMax);
document.getElementById('s-stops').textContent = stops.length;

/* ============================================================
   MAPPA
   ============================================================ */
const latlngs = TRACK.map(p => [p[1], p[0]]);

const map = L.map('map', { zoomControl: true, attributionControl: true });

const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
  maxZoom: 17,
  attribution: '© OpenStreetMap, SRTM | © <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA) | routing <a href="https://brouter.de">BRouter</a>'
}).addTo(map);

const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 18, attribution: '© Esri, Maxar, Earthstar Geographics'
});

const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© OpenStreetMap contributors'
});

L.control.layers(
  { 'Topografica': topo, 'Satellite': sat, 'Stradale': osm },
  {}, { position: 'topright' }
).addTo(map);

// Percorso: casing scuro + linea piena. La porzione "gia' percorsa"
// viene sovrascritta in tono spento quando si seleziona un punto.
// Puramente decorative: interactive:false lascia passare i click alle
// tratte cliccabili sottostanti.
L.polyline(latlngs, { color: '#14261c', weight: 8, opacity: .85, lineJoin: 'round', lineCap: 'round', interactive: false }).addTo(map);
L.polyline(latlngs, { color: '#f2683f', weight: 4,  opacity: .95, lineJoin: 'round', lineCap: 'round', interactive: false }).addTo(map);

const doneLine = L.polyline([], {
  color: '#7d9a80', weight: 4, opacity: .95, lineJoin: 'round', lineCap: 'round',
  interactive: false
}).addTo(map);

// Tratto evidenziato quando si seleziona un intervallo sull'altimetria
const rangeLine = L.polyline([], {
  color: '#e8b34f', weight: 6, opacity: 1, lineJoin: 'round', lineCap: 'round',
  interactive: false
}).addTo(map);

// Tratte cliccabili: polyline trasparenti e spesse, per il tocco su mobile
for (let s = 0; s < stops.length - 1; s++) {
  const seg = latlngs.slice(stopIndex[s], stopIndex[s + 1] + 1);
  if (seg.length < 2) continue;
  // bubblingMouseEvents:false impedisce che il click arrivi anche alla
  // mappa, che altrimenti azzererebbe subito la selezione appena fatta.
  L.polyline(seg, { color: '#fff', weight: 22, opacity: 0, bubblingMouseEvents: false })
    .addTo(map)
    .on('click',     e => { anchor = null; setPoint(nearestIndex(e.latlng)); })
    .on('mouseover', function () { this.setStyle({ opacity: .12 }); })
    .on('mouseout',  function () { this.setStyle({ opacity: 0 }); });
}

// Marker dei waypoint
stops.forEach((stop, i) => {
  const idx = stopIndex[i];
  const cls = stop.kind === 'peak' ? 'is-peak' : stop.kind === 'start' ? 'is-start' : stop.kind === 'end' ? 'is-end' : '';
  const label = stop.kind === 'end' ? '🎯' : stop.kind === 'peak' ? '▲' : (i + 1);

  L.marker([stop.lat, stop.lng], {
    icon: L.divIcon({
      html: `<div class="marker-pin ${cls}">${label}</div>`,
      className: '', iconSize: [28, 28], iconAnchor: [14, 14]
    }),
    zIndexOffset: stop.kind === 'mid' ? 0 : 500,
    bubblingMouseEvents: false
  })
    .addTo(map)
    .bindPopup(`
      <div class="popup-title">${i + 1}. ${stop.name}</div>
      <div class="popup-badges">
        <span class="badge q">⛰️ ${fmtM(TRACK[idx][2])}</span>
        <span class="badge km">${fmtKm(cumDist[idx])}</span>
        <span class="badge">🕒 ${stop.time}</span>
      </div>
      <div class="popup-notes">${stop.notes}</div>
    `)
    .on('click', () => { anchor = null; setPoint(idx); });
});

const cursor = L.circleMarker(latlngs[0], {
  radius: 7, color: '#fff', weight: 2.5, fillColor: '#e8b34f', fillOpacity: 1,
  interactive: false
}).addTo(map);
cursor.setStyle({ opacity: 0, fillOpacity: 0 });

const legend = L.control({ position: 'bottomleft' });
legend.onAdd = function () {
  const d = L.DomUtil.create('div', '');
  d.id = 'legend';
  d.innerHTML =
    '<div><i style="background:#f2683f"></i>da percorrere</div>' +
    '<div><i style="background:#7d9a80"></i>gi&agrave; percorso</div>' +
    '<div><i style="background:#c0392b"></i>vetta</div>';
  L.DomEvent.disableClickPropagation(d);
  return d;
};
legend.addTo(map);

map.fitBounds(L.latLngBounds(latlngs), { padding: [30, 30] });

function nearestIndex(latlng) {
  let best = 0, bestD = Infinity;
  for (let i = 0; i < N; i++) {
    const d = haversine(latlng.lng, latlng.lat, TRACK[i][0], TRACK[i][1]);
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

/* ============================================================
   GRAFICO ALTIMETRICO (SVG)
   ============================================================ */
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('chart');
const PAD = { t: 12, r: 10, b: 20, l: 42 };
let plot = null;   // geometria corrente del grafico

const el = (tag, attrs) => {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
};

function drawChart() {
  const wrap = document.getElementById('chartwrap');
  const W = wrap.clientWidth, H = wrap.clientHeight;
  if (W < 40 || H < 40) return;

  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  const iw = W - PAD.l - PAD.r, ih = H - PAD.t - PAD.b;
  const yLo = Math.floor(eleMin / 100) * 100;
  const yHi = Math.ceil(eleMax / 100) * 100;

  const X = m => PAD.l + (m / TOTAL_DIST) * iw;
  const Y = e => PAD.t + ih - ((e - yLo) / (yHi - yLo)) * ih;
  plot = { W, H, iw, ih, X, Y, yLo, yHi };

  // Gradienti
  const defs = el('defs');
  const g1 = el('linearGradient', { id: 'gFull', x1: 0, y1: 0, x2: 0, y2: 1 });
  g1.appendChild(el('stop', { offset: '0%',   'stop-color': '#f2683f', 'stop-opacity': .55 }));
  g1.appendChild(el('stop', { offset: '100%', 'stop-color': '#f2683f', 'stop-opacity': .04 }));
  const g2 = el('linearGradient', { id: 'gDone', x1: 0, y1: 0, x2: 0, y2: 1 });
  g2.appendChild(el('stop', { offset: '0%',   'stop-color': '#7d9a80', 'stop-opacity': .75 }));
  g2.appendChild(el('stop', { offset: '100%', 'stop-color': '#7d9a80', 'stop-opacity': .10 }));
  defs.appendChild(g1); defs.appendChild(g2);
  const g3 = el('linearGradient', { id: 'gRange', x1: 0, y1: 0, x2: 0, y2: 1 });
  g3.appendChild(el('stop', { offset: '0%',   'stop-color': '#e8b34f', 'stop-opacity': .70 }));
  g3.appendChild(el('stop', { offset: '100%', 'stop-color': '#e8b34f', 'stop-opacity': .08 }));
  defs.appendChild(g3);
  // Clip che rivela la porzione gia' percorsa
  const clip = el('clipPath', { id: 'clipDone' });
  const clipRect = el('rect', { x: PAD.l, y: 0, width: 0, height: H });
  clip.appendChild(clipRect); defs.appendChild(clip);
  // Clip che ritaglia il profilo sull'intervallo selezionato
  const clipR = el('clipPath', { id: 'clipRange' });
  const clipRangeRect = el('rect', { x: PAD.l, y: 0, width: 0, height: H });
  clipR.appendChild(clipRangeRect); defs.appendChild(clipR);
  svg.appendChild(defs);

  // Griglia orizzontale + etichette quota
  const steps = Math.min(5, Math.max(2, Math.round(ih / 42)));
  for (let s = 0; s <= steps; s++) {
    const e = yLo + (yHi - yLo) * (s / steps);
    const y = Y(e);
    svg.appendChild(el('line', {
      x1: PAD.l, y1: y, x2: W - PAD.r, y2: y,
      stroke: 'rgba(255,255,255,.07)', 'stroke-width': 1
    }));
    const t = el('text', {
      x: PAD.l - 7, y: y + 3.5, 'text-anchor': 'end',
      fill: '#7f9a82', 'font-size': 9.5, 'font-family': 'inherit'
    });
    t.textContent = Math.round(e);
    svg.appendChild(t);
  }

  // Profilo (quote reali, non lisciate)
  let d = '';
  for (let i = 0; i < N; i++) d += (i ? 'L' : 'M') + X(cumDist[i]).toFixed(1) + ' ' + Y(TRACK[i][2]).toFixed(1);
  const area = d + `L${X(TOTAL_DIST).toFixed(1)} ${PAD.t + ih}L${PAD.l} ${PAD.t + ih}Z`;

  svg.appendChild(el('path', { d: area, fill: 'url(#gFull)', stroke: 'none' }));
  svg.appendChild(el('path', { d: d, fill: 'none', stroke: '#f2683f', 'stroke-width': 1.7, 'stroke-linejoin': 'round' }));
  svg.appendChild(el('path', { d: area, fill: 'url(#gDone)', stroke: 'none', 'clip-path': 'url(#clipDone)' }));
  svg.appendChild(el('path', { d: d, fill: 'none', stroke: '#9db69f', 'stroke-width': 1.7, 'clip-path': 'url(#clipDone)' }));
  // Profilo evidenziato dentro l'intervallo selezionato
  svg.appendChild(el('path', { d: area, fill: 'url(#gRange)', stroke: 'none', 'clip-path': 'url(#clipRange)' }));
  svg.appendChild(el('path', { d: d, fill: 'none', stroke: '#e8b34f', 'stroke-width': 2.2, 'clip-path': 'url(#clipRange)' }));

  // Tacche dei waypoint
  stops.forEach((s, i) => {
    const idx = stopIndex[i], x = X(cumDist[idx]), y = Y(TRACK[idx][2]);
    svg.appendChild(el('line', {
      x1: x, y1: PAD.t, x2: x, y2: PAD.t + ih,
      stroke: 'rgba(232,179,79,.22)', 'stroke-width': 1, 'stroke-dasharray': '2 3'
    }));
    svg.appendChild(el('circle', {
      cx: x, cy: y, r: s.kind === 'mid' ? 2.6 : 4,
      fill: s.kind === 'peak' ? '#c0392b' : s.kind === 'end' ? '#e8b34f' : s.kind === 'start' ? '#4a9d5f' : '#e8b34f',
      stroke: '#163022', 'stroke-opacity': .5, 'stroke-width': 1
    }));
  });

  // Etichette distanza
  const kmStep = TOTAL_DIST > 30000 ? 5000 : 2000;
  for (let m = 0; m <= TOTAL_DIST; m += kmStep) {
    const t = el('text', {
      x: X(m), y: H - 6, 'text-anchor': 'middle',
      fill: '#7f9a82', 'font-size': 9.5, 'font-family': 'inherit'
    });
    t.textContent = (m / 1000) + (m === 0 ? ' km' : '');
    svg.appendChild(t);
  }

  // Banda dell'intervallo + maniglie agli estremi
  const band = el('rect', { y: PAD.t, height: ih, fill: '#e8b34f', 'fill-opacity': .13, x: 0, width: 0 });
  svg.appendChild(band);
  const hA = el('line', { y1: PAD.t, y2: PAD.t + ih, stroke: '#e8b34f', 'stroke-width': 2, opacity: 0 });
  const hB = el('line', { y1: PAD.t, y2: PAD.t + ih, stroke: '#e8b34f', 'stroke-width': 2, opacity: 0 });
  svg.appendChild(hA); svg.appendChild(hB);

  // Cursore (modalita' punto)
  const cLine = el('line', { y1: PAD.t, y2: PAD.t + ih, stroke: '#e8b34f', 'stroke-width': 1.4, opacity: 0 });
  const cDot  = el('circle', { r: 4.5, fill: '#e8b34f', stroke: '#163022', 'stroke-width': 1.5, opacity: 0 });
  svg.appendChild(cLine); svg.appendChild(cDot);

  Object.assign(plot, { cLine, cDot, clipRect, clipRangeRect, band, hA, hB });
  render();
}

// Indice del punto corrispondente a una distanza (ricerca binaria)
function indexAtDist(m) {
  let lo = 0, hi = N - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (cumDist[mid] < m) lo = mid + 1; else hi = mid;
  }
  return lo;
}

function pointerToIndex(evt) {
  const r = svg.getBoundingClientRect();
  const x = evt.clientX - r.left;
  const frac = (x - PAD.l) / plot.iw;
  return indexAtDist(Math.min(1, Math.max(0, frac)) * TOTAL_DIST);
}

/* Gesti sul grafico — due modi, entrambi attivi:
   - TRASCINAMENTO: definisce l'intervallo in un gesto solo (soglia DRAG_PX,
     sotto la quale il gesto vale come click e non come intervallo).
   - DUE CLICK: il primo fissa l'ancora, il secondo chiude l'intervallo.
   Con l'ancora attiva il passaggio del mouse mostra l'anteprima dell'intervallo. */
const DRAG_PX = 4;
let down = null;      // gesto in corso: { x, idx, moved }
let anchor = null;    // primo estremo fissato con un click

svg.addEventListener('pointerdown', e => {
  if (!plot) return;
  try { svg.setPointerCapture(e.pointerId); } catch (_) {}
  down = { x: e.clientX, idx: pointerToIndex(e), moved: false };
});

svg.addEventListener('pointermove', e => {
  if (!plot) return;
  if (down) {
    if (!down.moved && Math.abs(e.clientX - down.x) > DRAG_PX) down.moved = true;
    if (down.moved) setRange(down.idx, pointerToIndex(e));
    return;
  }
  if (e.pointerType !== 'mouse') return;
  const i = pointerToIndex(e);
  if (anchor !== null) setRange(anchor, i);   // anteprima verso il 2o punto
  else if (sel.mode !== 'range') setPoint(i); // anteprima del punto singolo
});

svg.addEventListener('pointerup', e => {
  if (!plot) { down = null; return; }
  try { svg.releasePointerCapture(e.pointerId); } catch (_) {}
  if (down) {
    if (down.moved) anchor = null;            // intervallo gia' definito col trascinamento
    else clickAt(down.idx);
  }
  down = null;
});

svg.addEventListener('pointercancel', () => { down = null; });

// Il mouse esce dal grafico: togli solo le anteprime non confermate
svg.addEventListener('pointerleave', () => {
  if (down || anchor !== null) return;
  if (sel.mode === 'point') setNone();
});

// Ciclo dei click: niente -> punto -> intervallo -> punto ...
function clickAt(i) {
  if (anchor !== null) { setRange(anchor, i); anchor = null; }
  else { anchor = i; setPoint(i); }
}

/* ============================================================
   SELEZIONE — stato unico condiviso da mappa, grafico e readout
   mode: 'none' | 'point' | 'range'
   ============================================================ */
let sel = { mode: 'none', a: null, b: null };
let raf = null;

const clampIdx = i => Math.max(0, Math.min(N - 1, i | 0));

function setNone()  { sel = { mode: 'none',  a: null, b: null }; render(); }
function setPoint(i){ sel = { mode: 'point', a: clampIdx(i), b: null }; render(); }

function setRange(i, j) {
  const a = clampIdx(Math.min(i, j)), b = clampIdx(Math.max(i, j));
  if (b - a < 1) { setPoint(a); return; }   // intervallo degenere: vale come punto
  sel = { mode: 'range', a, b };
  render();
}

function resetSel() { anchor = null; setNone(); }

function render() {
  if (raf) return;
  raf = requestAnimationFrame(() => { raf = null; draw(); });
}

// Riempie una casella del readout
function setRo(n, label, value, cls) {
  const box = document.getElementById('ro' + n);
  box.className = 'ro' + (cls ? ' ' + cls : '');
  box.firstElementChild.textContent = label;
  box.lastElementChild.textContent = value;
}

function draw() {
  document.body.classList.toggle('has-sel', sel.mode !== 'none');
  const hint = document.getElementById('hint');

  if (sel.mode === 'none') {
    setRo(1, 'Distanza',      fmtKm(TOTAL_DIST),        'c-gold');
    setRo(2, 'Dislivello +',  '+' + fmtM(TOTAL_ASC),    'c-route');
    setRo(3, 'Dislivello −',  '−' + fmtM(TOTAL_DESC),   'c-desc');
    setRo(4, 'Quota',         fmtM(eleMin) + ' → ' + fmtM(eleMax), 'c-soft');
    setRo(5, 'Tempo totale',  fmtDur(TOTAL_TIME),       'c-soft');
    hint.textContent = 'clicca o trascina sul grafico';
    hint.classList.remove('active');

  } else if (sel.mode === 'point') {
    const i = sel.a, dDone = cumDist[i];
    setRo(1, 'Quota',         fmtM(TRACK[i][2]), 'c-gold');
    setRo(2, 'Percorso',      fmtKm(dDone) + '  ·  ' + Math.round(dDone / TOTAL_DIST * 100) + '%', 'c-dim');
    setRo(3, 'Mancano',       fmtKm(TOTAL_DIST - dDone), 'c-route');
    setRo(4, 'Disl. residuo', '+' + fmtM(TOTAL_ASC - cumAsc[i]), 'c-soft');
    setRo(5, 'Tempo residuo', fmtDur(TOTAL_TIME * (1 - effort(i) / TOTAL_EFFORT)), 'c-soft');
    hint.textContent = anchor !== null ? 'clicca il 2° punto' : 'clicca per fissare il 1° punto';
    hint.classList.toggle('active', anchor !== null);

  } else {
    const { a, b } = sel;
    let lo = Infinity, hi = -Infinity;
    for (let i = a; i <= b; i++) {
      const e = TRACK[i][2];
      if (e < lo) lo = e;
      if (e > hi) hi = e;
    }
    setRo(1, 'Tratto',       fmtKm(cumDist[b] - cumDist[a]), 'c-gold');
    setRo(2, 'Dislivello +', '+' + fmtM(cumAsc[b]  - cumAsc[a]),  'c-route');
    setRo(3, 'Dislivello −', '−' + fmtM(cumDesc[b] - cumDesc[a]), 'c-desc');
    setRo(4, 'Quota',        fmtM(lo) + ' → ' + fmtM(hi), 'c-soft');
    setRo(5, 'Tempo tratto', fmtDur(TOTAL_TIME * (effort(b) - effort(a)) / TOTAL_EFFORT), 'c-soft');
    hint.textContent = 'da ' + fmtKm(cumDist[a]) + ' a ' + fmtKm(cumDist[b]);
    hint.classList.add('active');
  }

  drawMap();
  drawCursor();
}

function drawMap() {
  if (sel.mode === 'point') {
    doneLine.setLatLngs(latlngs.slice(0, sel.a + 1));
    rangeLine.setLatLngs([]);
    cursor.setLatLng(latlngs[sel.a]).setStyle({ opacity: 1, fillOpacity: 1 });
    cursor.bringToFront();
  } else if (sel.mode === 'range') {
    doneLine.setLatLngs([]);
    rangeLine.setLatLngs(latlngs.slice(sel.a, sel.b + 1));
    rangeLine.bringToFront();
    cursor.setStyle({ opacity: 0, fillOpacity: 0 });
  } else {
    doneLine.setLatLngs([]);
    rangeLine.setLatLngs([]);
    cursor.setStyle({ opacity: 0, fillOpacity: 0 });
  }
}

function drawCursor() {
  if (!plot) return;
  const { cLine, cDot, clipRect, clipRangeRect, band, hA, hB } = plot;

  if (sel.mode === 'point') {
    const x = plot.X(cumDist[sel.a]), y = plot.Y(TRACK[sel.a][2]);
    cLine.setAttribute('x1', x); cLine.setAttribute('x2', x); cLine.setAttribute('opacity', 1);
    cDot.setAttribute('cx', x);  cDot.setAttribute('cy', y);  cDot.setAttribute('opacity', 1);
    clipRect.setAttribute('width', Math.max(0, x - PAD.l));
  } else {
    cLine.setAttribute('opacity', 0);
    cDot.setAttribute('opacity', 0);
    clipRect.setAttribute('width', 0);
  }

  if (sel.mode === 'range') {
    const xa = plot.X(cumDist[sel.a]), xb = plot.X(cumDist[sel.b]);
    band.setAttribute('x', xa); band.setAttribute('width', Math.max(0, xb - xa));
    clipRangeRect.setAttribute('x', xa); clipRangeRect.setAttribute('width', Math.max(0, xb - xa));
    hA.setAttribute('x1', xa); hA.setAttribute('x2', xa); hA.setAttribute('opacity', 1);
    hB.setAttribute('x1', xb); hB.setAttribute('x2', xb); hB.setAttribute('opacity', 1);
  } else {
    band.setAttribute('width', 0);
    clipRangeRect.setAttribute('width', 0);
    hA.setAttribute('opacity', 0);
    hB.setAttribute('opacity', 0);
  }
}

map.on('click', () => resetSel());
document.getElementById('clear').addEventListener('click', e => { e.stopPropagation(); resetSel(); });

/* ============================================================
   PANNELLO
   ============================================================ */
const head = document.getElementById('panel-head');
head.addEventListener('click', () => {
  document.body.classList.toggle('collapsed');
  setTimeout(() => { map.invalidateSize(); drawChart(); }, 300);
});

let rz;
window.addEventListener('resize', () => {
  clearTimeout(rz);
  rz = setTimeout(() => { map.invalidateSize(); drawChart(); }, 120);
});

drawChart();
resetSel();
</script>

</body>
</html>
